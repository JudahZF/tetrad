# What Tetrad does, and how far each part is tested. `tetrad-cli capabilities` prints this file.
#
# tested:
#   "unit"  ran on the test unit (one original, non-ESS Quad Cortex; CorOS 4.1.0 and 4.1.1)
#   "host"  host tests only; not run on a unit
# gaps: what is missing or not tested. README.md, "Known gaps", has the full list.

schema_version = 2
release = "0.1.0-alpha.8"
coros = ["4.1.0", "4.1.1"]

[[capability]]
id = "firmware_profiles"
what = "Identifies the stock CorOS build by file hashes. On a build without a profile, the unit starts stock CorOS."
tested = "unit"

[[capability]]
id = "dsp"
what = "Boots the stock SHARC firmware on both DSP chips and deploys presets in the stock order, with audio over USB."
tested = "unit"
gaps = "Output parity with stock was checked on the test presets only."

[[capability]]
id = "block_drivers"
what = "A driver for every stock model except the Looper. The drivers read their tables from the stock ZenUI on the unit."
tested = "unit"

[[capability]]
id = "touch_ui"
what = "The 800x480 touch UI: Grid, Gig and Stomp views, preset and capture browsers, block editors, settings, dialogs and keypads."
tested = "unit"

[[capability]]
id = "performance"
what = "Footswitches, stomp and scene modes, scene copy, bank cycling, expression pedals, tempo and tap tempo, tuner, metronome and Looper."
tested = "unit"
gaps = "The panel controls were not tested one by one."

[[capability]]
id = "midi"
what = "DIN and USB MIDI in and out, program changes, MIDI clock and Preset MIDI Out."
tested = "unit"
gaps = "DIN MIDI is tested on the host only."

[[capability]]
id = "cortex_control"
what = "The USB link to Cortex Control: settings, Global EQ, meters, file browser, model presets, backups, the USB CorOS updater and cloud forwarding."
tested = "unit"
gaps = "Gain calibration and the log request are refused. Capture over Cortex Control is not tested."

[[capability]]
id = "usb_link"
what = "The Tetrad link over the USB HID interface, next to Cortex Control: version, screenshot, notices, the install of a signed Tetrad release, and messages to extensions with the usb capability (docs/usb.md)."
tested = "unit"
gaps = "Tested on a unit with Cortex Control 4.1.0 under Proton on Linux; macOS and Windows hosts are not tested. Extension messages are tested on the host only. One tetrad-usb at a time."

[[capability]]
id = "services"
what = "Wi-Fi, DHCP, time, internet checks, cloud sign-in, downloads and uploads, local and cloud backups."
tested = "unit"
gaps = "Support reports are off."

[[capability]]
id = "library"
what = "Reads and writes the stock preset library (CorOS 4.1.x schema) so that stock CorOS reads it back, and restores backups."
tested = "unit"

[[capability]]
id = "neural_capture"
what = "The capture screens, the Neural Capture V1 flow steps and the Neural Capture 2 dialog."
tested = "unit"
gaps = "Capture training and loading a user Neural Capture 2 capture are not tested on a unit."

[[capability]]
id = "boot_launcher"
what = "A one-line boot hook, the boot selector (CorOS or Tetrad for 5 seconds), and the start counter that starts stock CorOS after three failed starts."
tested = "unit"
gaps = "Not tested on a unit: a touch during a real boot, the 8 second selector kill and chooser off."

[[capability]]
id = "coros_updates"
what = "Downloads and installs a CorOS update on the unit. The new CorOS keeps the boot hook and the SSH keys."
tested = "unit"
gaps = "Tested from 4.1.0 to 4.1.1 only. A roll back to the other root partition is not tested."

[[capability]]
id = "tetrad_updates"
what = "Settings → Tetrad Updates: downloads the newest Tetrad release from GitHub, checks its Ed25519-signed manifest, the SHA-256 values and the CorOS support, arms it and restarts. CorOS does not change."
tested = "host"
gaps = "Not tested on a unit. The release key is a CI secret, so the signature does not protect against a change to the release workflow."

[[capability]]
id = "installer"
what = "scripts/install.sh: install, update, status, disable, enable and uninstall over root SSH, and the move of a zen-rs installation to Tetrad."
tested = "host"
gaps = "The release scripts and the zen-rs move are tested on a fake unit only."

[[capability]]
id = "mappings"
what = "One Mappings page for footswitch, pedal, MIDI, preset-load and extension triggers to system, block and Send MIDI actions, per preset and global."
tested = "unit"
gaps = "USB MIDI only on the unit (no DIN). No load-a-chosen-preset or set-tempo action."

[[capability]]
id = "extensions"
what = "TypeScript extensions in a confined runner process, installed from Ed25519-signed GitHub repositories; MIDI Mapper offers a second MIDI channel to Mappings."
tested = "unit"
gaps = "Install from the published default repository not yet tested on the unit (staged store only)."

[[capability]]
id = "dsp_extension_blocks"
what = "qcdsp graphs from extension packages, compiled on the unit against the stock Volume framework and deployed like stock models, with kernel-heap arenas (DM, else SD) for state above 32 KB; presets keep a stock placeholder and a record; Neural Amp Modeler builds NAM LSTM and WaveNet models up to the trainer's lite size (IR 3 networks in SIMD frame kernels)."
tested = "unit"
gaps = "Tested on one unit over USB audio: gain, saturator, slapback, a 187 ms arena echo and NAM blocks match their host twins (within 2e-6), a preset round trip through stock CorOS keeps the placeholder playing and Tetrad restores the block, and 100 redeploys of an arena block leave the heap unchanged. CPU is measured for one NAM model (about 1.4x the modelled instruction count; the catalogue charges 2x) and for heap probes: banks in a DM arena cost the same as in the block state, banks in an SD arena about 37 extra cycles per access (the estimate charges 40). A 512 KB SD arena started on cores 2, 3 and 4 and played correctly. A request larger than heap 0 faulted the unit (the kernel did not return 0), so the fit with exact heap figures is the only guard. NAM trainer nano, feather and lite run on the unit (lite about 75% of a core, matching the host within 1e-5); network kernels take 1.22 times their instruction count and the catalogue charges 1.4. The trainer's standard size needs more DM heap than one core has. Cortex Control gets the placeholder in whole presets; its partial grid pushes still carry the local model ID. A new or changed block compiles on the device loop (cached; at most 24 576 nodes after expansion)."

[[capability]]
id = "custom_footswitch_mode"
what = "A footswitch mode from an extension manifest (API 4): up to 4 pages of ten switches (A–D, Down, E–H, Tap) with system, page, block, preset (the loaded one or one chosen from a setlist), Send MIDI and extension command actions, LEDs, a Gig View page, an editor with copy, move and copy page, Mappings control, a stored layout and per-preset layouts (preset field 7003)."
tested = "host"
gaps = "Not run on a unit: switch latency, the LED frames and the Bank Up hold."

[[capability]]
id = "remote"
what = "A web page on port 80 (Settings → System → Remote) that converts IRs in the browser and imports them into the IR saving destination, behind a 4-digit PIN."
tested = "host"
gaps = "Not run on the unit yet. IR upload only."

[[capability]]
id = "owned_dsp_blocks"
what = "Five SHARC blocks with no stock code (Volume, Gain, Low-High Cut, Simple Gate, Graphic-9), experimental."
tested = "unit"
gaps = "Bring-up mode only, on DSP core 0, muted runs only."

[[capability]]
id = "offline_cli"
what = "tetrad-cli inspects and exports local files: presets, the model catalog, blobs, LDR images, settings and captures. It never connects to a unit."
tested = "host"

[[capability]]
id = "soak"
what = "A 61 minute run with Cortex Control connected and the USB clock."
tested = "unit"
