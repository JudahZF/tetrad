# Host checks on each push and pull request: build, tests, Clippy, rustfmt and rustdoc, with
# the qcdsp/ (JudahZF/qcdsp) and qc-dev/ (JudahZF/tetrad-toolchain) submodules, and the
# typecheck, lint and tests of the phone app (mobile/). The device (ARM) build is in release.yml.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Rust 1.95.0
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
          rustup default 1.95.0

      # The cache key includes the rustc version, so this step comes after the toolchain.
      # Only main saves the cache; other branches and pull requests restore it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build --locked --workspace --all-targets

      # The tests decode the packages that units download from the default extension repository.
      - name: Fetch the published extensions
        run: scripts/fetch-extensions.sh "$RUNNER_TEMP/extensions"

      - name: Test
        env:
          TETRAD_EXTENSIONS_DIR: ${{ runner.temp }}/extensions
        run: cargo test --locked --workspace

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # The dev build takes unsigned updates on a unit (docs/development.md, "Dev build").
      - name: Clippy (dev feature)
        run: cargo clippy --locked -p tetrad-app -p tetrad-ui -p tetrad-remote --all-targets --features dev -- -D warnings

      - name: Test (dev feature)
        env:
          TETRAD_EXTENSIONS_DIR: ${{ runner.temp }}/extensions
        run: cargo test --locked -p tetrad-app -p tetrad-ui -p tetrad-remote --features dev

      - name: Format
        run: cargo fmt --all -- --check

      # The launcher scripts run on BusyBox ash 1.23 on the unit: POSIX sh only. Warnings and
      # errors fail the step. Info and style notes differ between ShellCheck versions (0.9.0 on
      # the runner gives SC2015 for a correct `A && B || die` in install.sh; 0.11.0 does not).
      - name: ShellCheck
        run: |
          shellcheck --severity=warning -s sh scripts/launcher/*.sh scripts/install.sh \
            scripts/dev-update.sh scripts/build-dev.sh scripts/fetch-extensions.sh .cursor/install.sh
          shellcheck --severity=warning scripts/bringup/*.sh

      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps

  mobile:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: mobile/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  # Known advisories in Cargo.lock. An unmaintained crate is a warning and does not fail.
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Audit
        run: cargo audit
