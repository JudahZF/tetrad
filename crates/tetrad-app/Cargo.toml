[package]
name = "tetrad-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tetrad"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
qc-format.workspace = true
qcdsp.workspace = true
tetrad-catalog.workspace = true
tetrad-control.workspace = true
tetrad-core.workspace = true
tetrad-dsp-host.workspace = true
tetrad-dsp-protocol.workspace = true
tetrad-engine.workspace = true
tetrad-hal.workspace = true
tetrad-library.workspace = true
tetrad-loader.workspace = true
tetrad-preset.workspace = true
tetrad-services.workspace = true
tetrad-settings.workspace = true
tetrad-storage.workspace = true
tetrad-sys.workspace = true
tetrad-ui.workspace = true
tetrad-watchdog.workspace = true
tetrad-midi.workspace = true
tetrad-capture.workspace = true
tetrad-media.workspace = true
tetrad-firmware.workspace = true
tetrad-extensions.workspace = true
tetrad-theme.workspace = true
tetrad-remote.workspace = true
tetrad-usb.workspace = true
# Cortex Control compression (device/control.rs); its cipher comes from qc-format.
flate2.workspace = true
# Device Information Zenwireless row (`md5sum` of the WILC3000 firmware, device/info.rs).
md-5.workspace = true
sha2.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# Signs a test extension repository catalog (tests/device_extensions.rs).
base64.workspace = true
ed25519-dalek.workspace = true
# Builds a synthetic zenui.db for the device boot test; tetrad-storage already links it.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }

[lints]
workspace = true
