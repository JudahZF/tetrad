[package]
name = "tetrad-extensions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
base64.workspace = true
ed25519-dalek.workspace = true
semver = { workspace = true, features = ["serde"] }
sha2.workspace = true
serde.workspace = true
# raw_value: the runner forwards large call parameters without building a Value tree.
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
# Community DSP blocks ship as qcdsp IR inside packages.
qcdsp = { path = "../../qcdsp/crates/qcdsp" }

[lints]
workspace = true
