<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Tetrad Remote</title>
<style>
:root {
  --bg: #000; --fg: #fff; --muted: #9a9a9a; --panel: #141414; --line: #2e2e2e;
  --accent: #1a7fe6; --good: #4cd964; --busy: #ffc928; --bad: #ff3b3b;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: light) {
  :root { --bg: #f6f6f4; --fg: #0b0b0b; --muted: #5d5d5d; --panel: #fff; --line: #dcdcd8;
    --accent: #0b63c4; --good: #1f9d3a; --busy: #a87c00; --bad: #d42020; }
}
* { box-sizing: border-box; }
html { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--font); }
body { margin: 0; }
main { max-width: 640px; margin: 0 auto; padding: 32px 20px 64px; }
main.wide { max-width: 980px; }
h1 { margin: 0; font-size: 34px; line-height: 1.1; text-transform: uppercase; letter-spacing: .01em; }
h1 span { color: var(--accent); }
.sub { color: var(--muted); margin: 6px 0 28px; }
[hidden] { display: none !important; }
form { display: flex; gap: 10px; flex-wrap: wrap; }
input[type=text] {
  font: 700 28px/1 var(--font); letter-spacing: .3em; width: 9ch; padding: 10px 14px;
  background: var(--panel); color: var(--fg); border: 2px solid var(--line); border-radius: 12px;
}
input[type=text]:focus { outline: none; border-color: var(--accent); }
button {
  font: 600 16px var(--font); padding: 0 22px; min-height: 52px; border: 0; border-radius: 12px;
  background: var(--accent); color: #fff; cursor: pointer;
}
.link { background: none; color: var(--muted); padding: 0; min-height: 0; text-decoration: underline; white-space: nowrap; }
.message { min-height: 1.5em; margin: 12px 0 0; color: var(--bad); }
.drop {
  display: block; border: 2px dashed var(--accent); border-radius: 16px; padding: 40px 20px;
  text-align: center; color: var(--muted); cursor: pointer;
}
.drop strong { display: block; color: var(--fg); font-size: 20px; margin-bottom: 4px; }
.drop.over { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.drop input { display: none; }
ul { list-style: none; margin: 20px 0 0; padding: 0; }
li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  padding: 12px 0; border-top: 1px solid var(--line); }
li .name { overflow-wrap: anywhere; }
li small { display: block; color: var(--muted); font-size: 13px; }
li .state { font-weight: 600; white-space: nowrap; }
.added { color: var(--good); } .working { color: var(--busy); } .failed { color: var(--bad); }
.shell { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 32px; align-items: start; }
.side { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 16px; }
.side .group { margin: 18px 0 4px; padding: 0 14px; color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
.side .group:first-child { margin-top: 0; }
.side button { min-height: 42px; padding: 0 14px; text-align: left; background: none; color: var(--fg); border-radius: 10px; overflow-wrap: anywhere; }
.side button:hover { background: var(--panel); }
.side button[aria-selected=true] { background: var(--accent); color: #fff; }
.panes { min-width: 0; }
.tab-off { display: none !important; }
iframe.exttab { width: 100%; min-height: 70vh; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
@media (max-width: 720px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .side { flex-direction: row; flex-wrap: wrap; position: static; }
  .side .group { display: none; }
  .side button { min-height: 40px; background: var(--panel); border: 1px solid var(--line); }
}
.ext { margin-top: 40px; }
.ext h2 { margin: 0 0 12px; font-size: 22px; text-transform: uppercase; }
.small { min-height: 0; padding: 6px 12px; font-size: 14px; background: var(--panel); color: var(--bad); border: 1px solid var(--line); }
.ready { color: var(--good); }
.foot { margin-top: 28px; color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; gap: 12px; }
</style>
</head>
<body>
<main>
  <h1>Tetrad Remote<span>.</span></h1>
  <p class="sub" id="sub">Upload IRs and extension files to your Quad Cortex.</p>

  <section id="login">
    <p>Enter the PIN from <b>Settings → System → Remote</b> on the unit.</p>
    <form id="pin-form" autocomplete="off">
      <input id="pin" type="text" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required aria-label="PIN">
      <button type="submit">Connect</button>
    </form>
    <p class="message" id="login-message" role="status"></p>
  </section>

  <div class="shell" id="shell" hidden>
  <nav class="side" id="tabs" aria-label="Pages"></nav>
  <div class="panes" id="panes">
  <section id="upload" data-tab="IRs" data-group="Library" hidden>
    <label class="drop" id="drop">
      <strong>Drop IR files here</strong>
      or tap to choose. WAV or AIFF, any sample rate, mono or stereo.
      <input id="files" type="file" multiple accept=".wav,.wave,.aif,.aiff,audio/wav,audio/x-wav,audio/aiff">
    </label>
    <ul id="list"></ul>
    <div class="foot">
      <span>The unit keeps the first 1,024 samples (21 ms) at 48 kHz, as stock does.</span>
      <button class="link" id="forget" type="button">Change PIN</button>
    </div>
  </section>

  <section id="extfiles" data-tab="Files" data-group="Library" hidden>
    <div id="extlist"></div>
  </section>
  </div>
  </div>
</main>
<script>
"use strict";
const RATE = 48000;
const SAMPLES = 1024;
const MAX_NAME = 60;
const PIN_KEY = "tetrad-remote-pin";

const $ = (id) => document.getElementById(id);
let pin = localStorage.getItem(PIN_KEY) || "";
let queue = Promise.resolve();

function show(loggedIn, message) {
  $("login").hidden = loggedIn;
  $("upload").hidden = !loggedIn;
  $("shell").hidden = !loggedIn;
  document.querySelector("main").classList.toggle("wide", loggedIn);
  if (!loggedIn) $("extfiles").hidden = true;
  if (!loggedIn) for (const tab of extensionTabs.values()) tab.section.remove();
  if (!loggedIn) extensionTabs.clear();
  syncTabs();
  $("login-message").textContent = message || "";
}

async function call(path, options) {
  const headers = Object.assign({ "X-Tetrad-Pin": pin }, options && options.headers);
  let response;
  try {
    response = await fetch(path, Object.assign({}, options, { headers }));
  } catch (error) {
    return { status: 0, body: { error: "The unit is not reachable" } };
  }
  const body = await response.json().catch(() => ({ error: "Unexpected answer" }));
  return { status: response.status, body };
}

async function connect(candidate) {
  pin = candidate;
  const { status, body } = await call("/api/status");
  if (status === 200) {
    localStorage.setItem(PIN_KEY, pin);
    $("sub").textContent = "Saving to: " + body.folder;
    show(true);
    pollFiles();
    loadTabs();
    return;
  }
  forget(body.error);
}

/** The file name without its extension, as the unit shows names: at most 60 UTF-16 units. */
function irName(file) {
  let name = file.name.replace(/\.[^.]*$/, "").replace(/\s+/g, " ").trim();
  if (name.length > MAX_NAME) {
    name = name.slice(0, MAX_NAME);
    const last = name.charCodeAt(name.length - 1);
    if (last >= 0xd800 && last <= 0xdbff) name = name.slice(0, -1);
  }
  return name;
}

/**
 * Any file the browser decodes → 48 kHz (decodeAudioData resamples to its context rate) →
 * one channel (the destination mixes stereo to ½ L + ½ R) → the first 1,024 samples.
 */
async function convert(file) {
  const decoded = await new OfflineAudioContext(1, 1, RATE).decodeAudioData(await file.arrayBuffer());
  const frames = Math.min(SAMPLES, decoded.length);
  const context = new OfflineAudioContext(1, frames, RATE);
  const source = context.createBufferSource();
  source.buffer = decoded;
  source.connect(context.destination);
  source.start();
  const rendered = await context.startRendering();
  const count = decoded.numberOfChannels;
  const channels = count === 1 ? "mono" : (count === 2 ? "stereo" : count + " channels") + " → mono";
  const cut = decoded.length > SAMPLES ? ", first " + SAMPLES + " samples" : "";
  return { samples: rendered.getChannelData(0), detail: "48 kHz " + channels + cut };
}

/** The stock IR WAV: RIFF, an 18-byte IEEE-float fmt chunk, the data chunk at byte 38. */
function wav(samples) {
  const view = new DataView(new ArrayBuffer(46 + samples.length * 4));
  const tag = (at, text) => { for (let i = 0; i < 4; i++) view.setUint8(at + i, text.charCodeAt(i)); };
  tag(0, "RIFF");
  view.setUint32(4, 38 + samples.length * 4, true);
  tag(8, "WAVE");
  tag(12, "fmt ");
  view.setUint32(16, 18, true);
  view.setUint16(20, 3, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, RATE, true);
  view.setUint32(28, RATE * 4, true);
  view.setUint16(32, 4, true);
  view.setUint16(34, 32, true);
  view.setUint16(36, 0, true);
  tag(38, "data");
  view.setUint32(42, samples.length * 4, true);
  samples.forEach((sample, i) => view.setFloat32(46 + i * 4, sample, true));
  return view.buffer;
}

function row(file, list = $("list")) {
  const item = document.createElement("li");
  const name = document.createElement("span");
  name.className = "name";
  name.textContent = file.name;
  const detail = document.createElement("small");
  name.append(detail);
  const state = document.createElement("span");
  state.className = "state";
  item.append(name, state);
  list.prepend(item);
  return {
    set(text, kind, info) {
      state.textContent = text;
      state.className = "state " + kind;
      if (info !== undefined) detail.textContent = info;
    },
  };
}

async function send(file, line) {
  const name = irName(file);
  if (!name) return line.set("No name", "failed");
  line.set("Converting…", "working");
  let converted;
  try {
    converted = await convert(file);
  } catch (error) {
    return line.set("Not an audio file", "failed");
  }
  line.set("Uploading…", "working", converted.detail);
  const { status, body } = await call("/api/irs?name=" + encodeURIComponent(name), {
    method: "POST",
    headers: { "Content-Type": "audio/wav" },
    body: wav(converted.samples),
  });
  if (status === 200) return line.set("Added as " + body.name, "added");
  line.set(body.error || "Failed", "failed");
  // The unit made a new PIN (Remote restarted, or too many wrong PINs).
  if (status === 401) forget("Enter the PIN shown on the unit");
}

function forget(message) {
  localStorage.removeItem(PIN_KEY);
  pin = "";
  $("pin").value = "";
  show(false, message);
}

function add(files) {
  for (const file of files) {
    const line = row(file);
    line.set("Waiting", "working");
    queue = queue.then(() => send(file, line));
  }
}

const FILE_CHUNK = 48 * 1024;
const MAX_FILE_NAME = 48;
const extensionFiles = new Map();
let polls = 0;

function bytes(size) {
  return size >= 1048576 ? (size / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(size / 1024)) + " KB";
}

/** The name the extension reads: letters, digits, space, . _ - and an extension it lists. */
function fileName(name, allowed) {
  const lower = name.toLowerCase();
  const extension = allowed.find((e) => lower.endsWith(e));
  if (!extension) return null;
  const stem = name.slice(0, name.length - extension.length)
    .replace(/[^A-Za-z0-9 ._-]/g, "").replace(/\s+/g, " ").trim().replace(/^\.+/, "")
    .slice(0, MAX_FILE_NAME).trim();
  return stem ? stem + extension : null;
}

async function loadFiles() {
  const { status, body } = await call("/api/files");
  if (status === 401) return forget("Enter the PIN shown on the unit");
  if (status !== 200) return [];
  const root = $("extlist");
  const seen = new Set();
  for (const info of body.extensions) {
    seen.add(info.id);
    if (!extensionFiles.has(info.id)) extensionFiles.set(info.id, buildExtension(info, root));
    extensionFiles.get(info.id).update(info);
  }
  for (const [id, entry] of extensionFiles) {
    if (!seen.has(id)) { entry.box.remove(); extensionFiles.delete(id); }
  }
  $("extfiles").hidden = extensionFiles.size === 0;
  syncTabs();
  return body.extensions;
}

/** Reads the files again until the extensions have read them all (they build in the background). */
async function pollFiles(again) {
  polls = again ? polls + 1 : 0;
  const all = await loadFiles();
  const waiting = all.some((info) => info.files.some((file) => file.state === "waiting"));
  if (waiting && polls < 15) setTimeout(() => pollFiles(true), 2000);
}

function buildExtension(info, root) {
  const box = document.createElement("div");
  box.className = "ext";
  const title = document.createElement("h2");
  const drop = document.createElement("label");
  drop.className = "drop";
  const strong = document.createElement("strong");
  const input = document.createElement("input");
  input.type = "file";
  input.multiple = true;
  input.accept = info.extensions.join(",");
  drop.append(strong, "or tap to choose.", input);
  const results = document.createElement("ul");
  const list = document.createElement("ul");
  box.append(title, drop, results, list);
  root.append(box);
  let current = info;
  const add = (files) => {
    for (const file of files) {
      const line = row(file, results);
      line.set("Waiting", "working");
      queue = queue.then(() => sendFile(current, file, line)).then(() => pollFiles());
    }
  };
  input.addEventListener("change", (event) => { add(event.target.files); event.target.value = ""; });
  drop.addEventListener("dragover", (event) => { event.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (event) => {
    event.preventDefault();
    drop.classList.remove("over");
    add(event.dataTransfer.files);
  });
  return {
    box,
    update(next) {
      current = next;
      title.textContent = next.name;
      strong.textContent = "Drop " + next.label + " files here";
      input.accept = next.extensions.join(",");
      list.replaceChildren(...next.files.map((file) => fileRow(next, file)));
    },
  };
}

function fileRow(info, file) {
  const item = document.createElement("li");
  const name = document.createElement("span");
  name.className = "name";
  name.textContent = file.name;
  const detail = document.createElement("small");
  const state = { ready: "Ready", waiting: "Reading…", failed: "Failed" }[file.state] || file.state;
  detail.textContent = bytes(file.size) + " · " + state + (file.detail ? ": " + file.detail : "");
  if (file.state === "failed") detail.className = "failed";
  name.append(detail);
  const remove = document.createElement("button");
  remove.type = "button";
  remove.className = "small";
  remove.textContent = "Delete";
  remove.addEventListener("click", async () => {
    if (!confirm("Delete " + file.name + " from the unit?")) return;
    remove.disabled = true;
    const { status, body } = await call(
      "/api/files/delete?id=" + encodeURIComponent(info.id) + "&name=" + encodeURIComponent(file.name),
      { method: "POST", body: "" },
    );
    if (status === 401) return forget("Enter the PIN shown on the unit");
    if (status !== 200) { remove.disabled = false; alert(body.error || "Failed"); return; }
    pollFiles();
  });
  item.append(name, remove);
  return item;
}

async function sendFile(info, file, line) {
  const name = fileName(file.name, info.extensions);
  if (!name) return line.set("Not a " + info.label + " file", "failed", info.extensions.join(", "));
  if (file.size > info.maxBytes) return line.set("Too large", "failed", "At most " + bytes(info.maxBytes));
  const renamed = name !== file.name ? "Stored as " + name : "";
  for (let offset = 0; offset === 0 || offset < file.size; offset += FILE_CHUNK) {
    const end = Math.min(offset + FILE_CHUNK, file.size);
    line.set(Math.round((100 * end) / Math.max(1, file.size)) + "%", "working", bytes(file.size));
    const last = end >= file.size ? "&last=1" : "";
    const { status, body } = await call(
      "/api/files/chunk?id=" + encodeURIComponent(info.id) + "&name=" + encodeURIComponent(name) +
        "&offset=" + offset + last,
      { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: file.slice(offset, end) },
    );
    if (status === 401) forget("Enter the PIN shown on the unit");
    if (status !== 200) return line.set(body.error || "Failed", "failed");
  }
  line.set("Added", "added", renamed || bytes(file.size));
}

/* Pages: every section of #panes with a data-tab that is not hidden is a page in the sidebar,
   under its data-group. The sidebar shows whenever the PIN is accepted. */
const GROUPS = ["Library", "Extensions", "Developer"];
let currentTab = "";
function syncTabs() {
  const all = [...document.querySelectorAll("#panes > section[data-tab]")];
  const sections = all.filter((section) => !section.hidden);
  const names = sections.map((section) => section.dataset.tab);
  if (!names.includes(currentTab)) currentTab = names[0] || "";
  const bar = $("tabs");
  const items = [];
  for (const group of GROUPS) {
    const inGroup = sections.filter((section) => (section.dataset.group || "Extensions") === group);
    if (!inGroup.length) continue;
    const label = document.createElement("div");
    label.className = "group";
    label.textContent = group;
    items.push(label);
    for (const section of inGroup) {
      const name = section.dataset.tab;
      const button = document.createElement("button");
      button.type = "button";
      button.setAttribute("aria-selected", String(name === currentTab));
      button.textContent = name;
      button.addEventListener("click", () => { currentTab = name; syncTabs(); });
      items.push(button);
    }
  }
  bar.replaceChildren(...items);
  for (const section of all) section.classList.toggle("tab-off", section.dataset.tab !== currentTab);
  if (currentTab) showTab(currentTab);
}

/* The tabs that extensions add: a page of the extension in a frame that has no access to this
   page, the PIN or the network. It sends messages with tetrad.send(); this page forwards them
   to the extension and sends the answer back. */
const FRAME_BRIDGE = `<!doctype html><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'">
<script>
(function () {
  let n = 0;
  const waiting = new Map();
  window.addEventListener("message", (event) => {
    const m = event.data;
    if (event.source !== parent || !m || m.type !== "tetrad-reply" || !waiting.has(m.n)) return;
    const w = waiting.get(m.n);
    waiting.delete(m.n);
    if (m.error) w.reject(new Error(m.error)); else w.resolve(m.result);
  });
  window.tetrad = { send(message) {
    return new Promise((resolve, reject) => {
      const id = ++n;
      waiting.set(id, { resolve, reject });
      parent.postMessage({ type: "tetrad-call", n: id, message }, "*");
    });
  } };
})();
<\/script>`;
const extensionTabs = new Map();

async function loadTabs() {
  const { status, body } = await call("/api/tabs");
  if (status === 401) return forget("Enter the PIN shown on the unit");
  if (status !== 200) return;
  for (const info of body.tabs) {
    if (extensionTabs.has(info.id)) continue;
    const section = document.createElement("section");
    section.dataset.tab = info.title;
    section.dataset.group = "Extensions";
    const frame = document.createElement("iframe");
    frame.className = "exttab";
    frame.setAttribute("sandbox", "allow-scripts");
    frame.title = info.title;
    section.append(frame);
    $("panes").append(section);
    extensionTabs.set(info.id, { section, frame, loaded: false, info });
  }
  syncTabs();
}

/** Loads the page of an extension tab when it is shown the first time. */
async function showTab(name) {
  for (const tab of extensionTabs.values()) {
    if (tab.info.title !== name || tab.loaded) continue;
    tab.loaded = true;
    const { status, body } = await call("/api/tabs/page?id=" + encodeURIComponent(tab.info.id));
    if (status === 401) return forget("Enter the PIN shown on the unit");
    tab.frame.srcdoc = status === 200 ? FRAME_BRIDGE + body.html : "<p>" + (body.error || "Failed") + "</p>";
  }
}

window.addEventListener("message", async (event) => {
  const tab = [...extensionTabs.values()].find((candidate) => candidate.frame.contentWindow === event.source);
  const m = event.data;
  if (!tab || !m || m.type !== "tetrad-call") return;
  const { status, body } = await call("/api/tabs/call?id=" + encodeURIComponent(tab.info.id), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(m.message === undefined ? null : m.message),
  });
  if (status === 401) forget("Enter the PIN shown on the unit");
  const answer = status === 200 ? { result: body.result } : { error: body.error || "Failed" };
  event.source.postMessage(Object.assign({ type: "tetrad-reply", n: m.n }, answer), "*");
});

$("pin-form").addEventListener("submit", (event) => {
  event.preventDefault();
  connect($("pin").value.trim());
});
$("forget").addEventListener("click", () => forget());
$("files").addEventListener("change", (event) => {
  add(event.target.files);
  event.target.value = "";
});
const drop = $("drop");
drop.addEventListener("dragover", (event) => { event.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (event) => {
  event.preventDefault();
  drop.classList.remove("over");
  add(event.dataTransfer.files);
});
// Files dropped beside the zone would open in the tab.
window.addEventListener("dragover", (event) => event.preventDefault());
window.addEventListener("drop", (event) => event.preventDefault());

if (pin) connect(pin); else show(false);
</script>
</body>
</html>
