[workspace]
members = ["crates/tetrad-preset", "crates/tetrad-catalog", "crates/tetrad-cli", "crates/tetrad-core", "crates/tetrad-control", "crates/tetrad-hal", "crates/tetrad-runtime", "crates/tetrad-dsp-protocol", "crates/tetrad-loader", "crates/tetrad-capture", "crates/tetrad-storage", "crates/tetrad-sharc", "crates/tetrad-media", "crates/tetrad-ui", "crates/tetrad-assets", "crates/tetrad-dsp-host", "crates/tetrad-library", "crates/tetrad-engine", "crates/tetrad-sys", "crates/tetrad-app", "crates/tetrad-watchdog", "crates/tetrad-midi", "crates/tetrad-services", "crates/tetrad-settings", "crates/tetrad-blocks", "crates/tetrad-firmware"]
# qcdsp/ (its own Cargo workspace) and qc-dev/ are git submodules, not members.
exclude = ["qcdsp", "qc-dev"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.95"
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/JudahZF/tetrad"

[workspace.dependencies]
tetrad-preset = { path = "crates/tetrad-preset" }
tetrad-catalog = { path = "crates/tetrad-catalog" }
tetrad-core = { path = "crates/tetrad-core" }
tetrad-control = { path = "crates/tetrad-control" }
tetrad-hal = { path = "crates/tetrad-hal" }
tetrad-runtime = { path = "crates/tetrad-runtime" }
tetrad-dsp-protocol = { path = "crates/tetrad-dsp-protocol" }
tetrad-loader = { path = "crates/tetrad-loader" }
tetrad-storage = { path = "crates/tetrad-storage" }
tetrad-sharc = { path = "crates/tetrad-sharc" }
tetrad-media = { path = "crates/tetrad-media" }
tetrad-capture = { path = "crates/tetrad-capture" }
tetrad-ui = { path = "crates/tetrad-ui" }
tetrad-assets = { path = "crates/tetrad-assets" }
tetrad-dsp-host = { path = "crates/tetrad-dsp-host" }
tetrad-library = { path = "crates/tetrad-library" }
tetrad-engine = { path = "crates/tetrad-engine" }
tetrad-sys = { path = "crates/tetrad-sys" }
tetrad-midi = { path = "crates/tetrad-midi" }
tetrad-services = { path = "crates/tetrad-services" }
tetrad-settings = { path = "crates/tetrad-settings" }
tetrad-watchdog = { path = "crates/tetrad-watchdog" }
tetrad-blocks = { path = "crates/tetrad-blocks" }
tetrad-firmware = { path = "crates/tetrad-firmware" }
qc-format = { path = "qcdsp/crates/qc-format" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.190"
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
aes = "0.9"
ctr = "0.10"
md-5 = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zeroize = "1.9"
base64 = "0.22"
fontdue = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
